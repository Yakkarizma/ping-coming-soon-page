<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Coming Soon Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

    <div class="container">
        <div class="content-container">
            <div style="margin-bottom: 30px;">
                <img src="img/logo.svg" alt="" style="margin-bottom: 50px;">
                <h1 style="margin-bottom: 20px;  color: var(--Gray-400); font-weight: 300;" >We are launching <span style="font-weight: 700; color: black;">soon!</span></h1>
                <p>Subscribe and get notified</p>
            </div>
            <div class="notify-container">
                <div class="notify">
                    <input type="text" class="input" placeholder="Your email address...">
                    <button class="btn">Notify Me</button>
                </div>
                <p class="error-message">Please provide a valid email address</p>
            </div>
            <div class="dashboard">
                <img src="img/illustration-dashboard.png" alt="">
            </div>
            <div class="social-buttons">
                <i class="fa-brands fa-facebook-f"></i>
                <i class="fa-brands fa-twitter"></i>
                <i class="fa-brands fa-instagram"></i>
            </div>
            <div class="copyright">
                ©Copyright Ping. All Rights Reserved.
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
